<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My NetLogo Web Model</title>

<!-- NetLogo Web engine -->
<script src="https://www.netlogoweb.org/assets/NetLogoWeb.js"></script>

<style>
  body {
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    padding:20px;
  }
  #netlogo-container {
    width:900px;
    height:600px;
    margin-top:15px;
    border:2px solid #333;
  }
</style>
</head>

<body>

<h1>NetLogo Web Model Viewer</h1>
<p>This page runs my NetLogo model in the browser.</p>

<div id="netlogo-container"></div>

<script>
  NetLogoWeb.runModelFromUrl(
    "NetLogoPO.nlogox",   // ← CHANGE THIS to the .nlogox filename you upload
    document.getElementById("netlogo-container")
  );
</script>

</body>
</html>
